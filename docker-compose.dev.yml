services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: archiv
      POSTGRES_PASSWORD: archiv
      POSTGRES_DB: archiv
    ports: ["5432:5432"]
    volumes: [dev-db:/var/lib/postgresql/data]
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: archiv
      POSTGRES_PASSWORD: archiv
      POSTGRES_DB: archiv_test
    ports: ["5433:5432"]
volumes:
  dev-db:
