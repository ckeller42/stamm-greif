# Explicit project name: without it, this file and the production docker-compose.yml share the
# directory-derived project "stamm-greif", so their identically-named `db` services collide —
# `up -d db` from one file silently recreates the OTHER stack's container on the wrong volume
# (this happened; see git history of the heic-support branch).
name: stamm-greif-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: archiv
      POSTGRES_PASSWORD: archiv
      POSTGRES_DB: archiv
    # Bind to loopback only: the dev DB uses committed throwaway credentials, so it must not be
    # reachable from other hosts on the network.
    ports: ["127.0.0.1:5432:5432"]
    volumes: [dev-db:/var/lib/postgresql/data]
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: archiv
      POSTGRES_PASSWORD: archiv
      POSTGRES_DB: archiv_test
    ports: ["127.0.0.1:5433:5432"]
volumes:
  dev-db:
