name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # Local dev uses docker-compose.dev.yml for both databases (db on :5432, db-test on :5433).
    # CI reuses that exact compose file so the test commands need no CI-specific rewiring:
    # test:int already targets :5433/archiv_test, and the e2e webServer targets :5432/archiv.
    env:
      PAYLOAD_SECRET: ci-not-a-real-secret
      DATABASE_URI: postgres://archiv:archiv@localhost:5432/archiv
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack / pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start databases (dev + test Postgres)
        run: docker compose -f docker-compose.dev.yml up -d

      - name: Wait for Postgres (dev + test)
        # pg_isready runs inside the postgres containers (guaranteed present there, unlike the
        # runner host), so no postgresql-client install is needed.
        run: |
          for svc in db db-test; do
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.dev.yml exec -T "$svc" pg_isready -U archiv >/dev/null 2>&1; then
                echo "postgres $svc ready"; break
              fi
              [ "$i" = 30 ] && { echo "postgres $svc never came up"; exit 1; }
              sleep 2
            done
          done

      - run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test:unit

      # invites.int.test.ts drives the real /api/invites/accept HTTP endpoint, so the app must
      # be running against the SAME database the test writes to (test DB on :5433). This server
      # is torn down before the e2e step, which starts its own dev server against the dev DB.
      - name: Start app for integration tests (test DB)
        run: |
          DATABASE_URI=postgres://archiv:archiv@localhost:5433/archiv_test pnpm dev \
            > /tmp/int-app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/anmelden >/dev/null 2>&1 && { echo "app up"; break; }
            [ "$i" = 60 ] && { echo "app never came up"; cat /tmp/int-app.log; exit 1; }
            sleep 2
          done

      - name: Integration tests
        run: pnpm test:int

      - name: Stop integration app
        if: always()
        # Wait for the port to actually free so the e2e webServer (reuseExistingServer) can't
        # latch onto the dying int server, which points at the wrong database.
        run: |
          kill $(lsof -t -i:3000) 2>/dev/null || true
          for i in $(seq 1 15); do
            lsof -t -i:3000 >/dev/null 2>&1 || { echo "port 3000 free"; break; }
            sleep 1
          done

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Create the schema in the e2e DB up front. Otherwise Playwright's globalSetup (seeding via
      # Local API) and the webServer's `pnpm dev` both push the schema into a fresh DB at the same
      # time — a concurrent-DDL race that loses the seed and makes login fail. Locally this never
      # bit because the dev-db volume already had the schema.
      - name: Initialize e2e database schema
        run: pnpm payload migrate

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    # Guards the production Docker build path: next build with output:'standalone'. PAYLOAD_SECRET
    # is a build-time placeholder only (the real one is injected at container runtime), mirroring
    # the Dockerfile's own build stage.
    env:
      PAYLOAD_SECRET: build-time-placeholder-not-used-at-runtime
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack / pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Production build (standalone)
        run: pnpm build
