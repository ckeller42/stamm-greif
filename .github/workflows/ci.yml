name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks + unit + HTTP-driven integration tests. Integration lives here (not with e2e)
  # because invites.int.test.ts needs a running app server on the TEST database (:5433); keeping
  # it on its own runner means that server can never be reused by the e2e webServer.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAYLOAD_SECRET: ci-not-a-real-secret
      NEXT_TELEMETRY_DISABLED: '1'
      FACE_MODELS_DIR: models/faces
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Cache face models
        uses: actions/cache@v4
        with:
          path: models/faces
          key: face-models-${{ hashFiles('scripts/fetch-face-models.sh') }}

      - name: Fetch face models
        run: scripts/fetch-face-models.sh

      - name: Start test database
        run: docker compose -f docker-compose.dev.yml up -d db-test

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker compose -f docker-compose.dev.yml exec -T db-test pg_isready -U archiv >/dev/null 2>&1 \
              && { echo "test db ready"; break; }
            [ "$i" = 30 ] && { echo "test db never came up"; exit 1; }
            sleep 2
          done

      - run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Migration drift check
        env:
          DATABASE_URI: postgres://archiv:archiv@localhost:5433/archiv_test
        run: |
          docker compose -f docker-compose.dev.yml exec -T db-test psql -U archiv -d archiv_test \
            -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;" >/dev/null
          pnpm payload migrate
          before=$(find src/migrations -maxdepth 1 -name '*.ts' | wc -l)
          pnpm payload migrate:create ci_drift_check --skip-empty
          after=$(find src/migrations -maxdepth 1 -name '*.ts' | wc -l)
          if [ "$after" -ne "$before" ]; then
            echo "::error::Schema drift: run pnpm payload migrate:create and commit the result"
            git status --porcelain src/migrations/
            exit 1
          fi
          echo "no drift"

      - name: Unit tests
        run: |
          set -o pipefail
          pnpm test:unit 2>&1 | tee /tmp/unit.out
          { echo '### Unit test coverage'; echo '```'; grep -A 100 'Coverage report' /tmp/unit.out | head -40 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # invites.int.test.ts drives the real /api/invites/accept HTTP endpoint, so the app must be
      # running against the same database the test writes to (test DB on :5433). The job ends
      # right after, so this background server is torn down with the runner — no manual cleanup.
      - name: Start app for integration tests (test DB)
        run: |
          DATABASE_URI=postgres://archiv:archiv@localhost:5433/archiv_test pnpm dev \
            > /tmp/int-app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/anmelden >/dev/null 2>&1 && { echo "app up"; break; }
            [ "$i" = 60 ] && { echo "app never came up"; cat /tmp/int-app.log; exit 1; }
            sleep 2
          done

      - name: Integration tests
        run: pnpm test:int

  # End-to-end browser test on its own runner: Playwright manages the app server itself
  # (reuseExistingServer is off in CI), against the dev database on :5432.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAYLOAD_SECRET: ci-not-a-real-secret
      DATABASE_URI: postgres://archiv:archiv@localhost:5432/archiv
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Start dev database
        run: docker compose -f docker-compose.dev.yml up -d db

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker compose -f docker-compose.dev.yml exec -T db pg_isready -U archiv >/dev/null 2>&1 \
              && { echo "dev db ready"; break; }
            [ "$i" = 30 ] && { echo "dev db never came up"; exit 1; }
            sleep 2
          done

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Create the schema up front so Playwright's globalSetup (Local API seeding) and the
      # webServer don't both push it into a fresh DB at once — a concurrent-DDL race that would
      # lose the seed.
      - name: Initialize e2e database schema
        run: pnpm payload migrate

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Builds the production image and boots the full compose stack (app + db + caddy via the
  # localhost override), then smoke-tests through Caddy. This is the only place CI verifies the
  # actual deployment artifact: Dockerfile stages, USER node, /app/photos ownership, compose
  # wiring, migrations-in-stack.
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Create throwaway env
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "PAYLOAD_SECRET=$(openssl rand -hex 32)"
          } > .env

      - name: Build images
        run: docker compose build

      - name: Verify instrumentation is shipped
        run: docker compose run --rm --no-deps --entrypoint sh app -c 'test -f /app/.next/server/instrumentation.js' && echo "instrumentation shipped"

      # P2.3, Task 3 review: same class of silent-failure the instrumentation check above guards
      # against, for onnxruntime-web's .wasm. Next's file tracer does NOT sweep it into
      # .next/standalone automatically (verified directly, task-3-report.md) — next.config.ts's
      # `outputFileTracingIncludes` is what puts it there, and a future change to that config (or
      # a Next/onnxruntime-web upgrade that moves where the tracer resolves the package) could
      # silently drop it again: `docker build`, `pnpm build`'s probe-faces.mjs (runs via tsx
      # against source in the `build` stage, never touches the traced `run`-stage bundle) and the
      # HEIC probe below would all still pass, and the only symptom would be "no suggestions,
      # ever" in production, weeks later. Real path confirmed by running the built image locally
      # and listing it (`docker run --rm --entrypoint sh <image> -c 'ls /app/node_modules/.pnpm/
      # onnxruntime-web@*/node_modules/onnxruntime-web/dist/*.wasm'`) — there is no top-level
      # `/app/node_modules/onnxruntime-web` symlink in the standalone output at all, only the real
      # pnpm-store-shaped path. Version-agnostic glob (matches next.config.ts's own glob) so a
      # routine onnxruntime-web bump doesn't need this step edited in lockstep.
      - name: Verify onnxruntime-web wasm is shipped
        run: |
          docker compose run --rm --no-deps --entrypoint sh app -c \
            'ls /app/node_modules/.pnpm/onnxruntime-web@*/node_modules/onnxruntime-web/dist/*.wasm >/dev/null' \
            && echo "onnxruntime-web wasm shipped"

      # P2.5 Fotobuch (Task 4 report): a clean `pnpm build` traces @react-pdf/renderer + yoga's
      # base64-inlined wasm into .next/standalone automatically, no outputFileTracingIncludes
      # needed — but that was proven with a temporary probe route, not the shipped image. This is
      # the permanent equivalent of the onnxruntime-web check above: run the render probe against
      # the actual built image's node_modules, not host node_modules, so a future Next/yoga upgrade
      # that silently drops the traced wasm asset fails CI loudly instead of shipping a build whose
      # only symptom is "PDF generation throws in production".
      - name: Verify @react-pdf/renderer renders in the built image
        run: |
          docker compose run --rm --no-deps --entrypoint sh app -c \
            'node /app/scripts/probe-fotobuch.mjs'

      - name: Boot stack and migrate
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml up -d db
          docker compose run --rm migrate
          docker compose -f docker-compose.yml -f docker-compose.local.yml up -d

      - name: Smoke test through Caddy
        run: |
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://127.0.0.1/anmelden || true)
            [ "$code" = "200" ] && { echo "smoke OK"; exit 0; }
            sleep 3
          done
          echo "::error::stack never served /anmelden with 200 (last code: $code)"
          docker compose logs
          exit 1

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml down -v

  # Advisory checks — deliberately NOT in the required-checks list: an audit false positive
  # must not freeze merges. Red here means "look", not "stop".
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Dependency audit (prod, high+)
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
