name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # Local dev uses docker-compose.dev.yml for both databases (db on :5432, db-test on :5433).
    # CI reuses that exact compose file so the test commands need no CI-specific rewiring:
    # test:int already targets :5433/archiv_test, and the e2e webServer targets :5432/archiv.
    env:
      PAYLOAD_SECRET: ci-not-a-real-secret
      DATABASE_URI: postgres://archiv:archiv@localhost:5432/archiv
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack / pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start databases (dev + test Postgres)
        run: docker compose -f docker-compose.dev.yml up -d

      - name: Wait for Postgres (dev + test)
        # pg_isready runs inside the postgres containers (guaranteed present there, unlike the
        # runner host), so no postgresql-client install is needed.
        run: |
          for svc in db db-test; do
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.dev.yml exec -T "$svc" pg_isready -U archiv >/dev/null 2>&1; then
                echo "postgres $svc ready"; break
              fi
              [ "$i" = 30 ] && { echo "postgres $svc never came up"; exit 1; }
              sleep 2
            done
          done

      - run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:int

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    # Guards the production Docker build path: next build with output:'standalone'. PAYLOAD_SECRET
    # is a build-time placeholder only (the real one is injected at container runtime), mirroring
    # the Dockerfile's own build stage.
    env:
      PAYLOAD_SECRET: build-time-placeholder-not-used-at-runtime
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack / pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Production build (standalone)
        run: pnpm build
